[project]
name = "rootlens-api"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "ollama>=0.6.2",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0",
    "sqlglot>=30.18.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]  # autogenerated migration bodies

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# CSV fixture literals in tests are single long lines by nature.
"tests/integration/test_loaders.py" = ["E501"]
"tests/integration/test_loaders_remaining.py" = ["E501"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
disallow_untyped_defs = true
ignore_missing_imports = true
